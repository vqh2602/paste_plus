name: Build & Release Windows App (Beta)

on:
  push:
    branches:
      - windows
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release (e.g. 1.0.0.beta)'
        required: false
        default: '1.0.0.beta'
      draft:
        description: 'Create a draft release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-windows:
    name: Build & Release Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows Release App
        run: flutter build windows --release

      - name: Create ZIP archive of Windows App
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath ClipFlow-Windows.zip
        shell: powershell

      - name: Determine Release Tag
        id: tag_info
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ github.event.inputs.tag_name }}" -ne "") {
            echo "tag=${{ github.event.inputs.tag_name }}" >> $env:GITHUB_OUTPUT
          } else {
            echo "tag=1.0.0.beta" >> $env:GITHUB_OUTPUT
          }
        shell: powershell

      - name: Create GitHub Release & Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: Release ${{ steps.tag_info.outputs.tag }}
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: true
          generate_release_notes: true
          files: ClipFlow-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
