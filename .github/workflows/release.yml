name: Build & Release ClipFlow (macOS, iOS, Android & Windows)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'
      draft:
        description: 'Create a draft release'
        type: boolean
        default: false
      prerelease:
        description: 'Create a pre-release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-macos:
    name: Build & Release macOS
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify generated localizations
        run: |
          flutter gen-l10n
          git diff --exit-code -- lib/l10n/app_localizations*.dart

      - name: Run unit tests
        run: flutter test

      - name: Build macOS Release App
        run: flutter build macos --release

      - name: Create ZIP archive of macOS App
        run: |
          cd build/macos/Build/Products/Release
          zip -r ClipFlow-macOS.zip ClipFlow.app

      - name: Determine Release Tag
        id: tag_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Extract Changelog from CHANGELOG.md
        run: python3 tool/extract_changelog.py "${{ steps.tag_info.outputs.tag }}" RELEASE_NOTES.md

      - name: Create GitHub Release & Upload macOS Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: Release ${{ steps.tag_info.outputs.tag }}
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
          files: |
            build/macos/Build/Products/Release/ClipFlow-macOS.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Build & Release Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows Release App
        run: flutter build windows --release

      - name: Create ZIP archive of Windows App
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath ClipFlow-Windows.zip
        shell: powershell

      - name: Determine Release Tag
        id: tag_info
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ github.event.inputs.tag_name }}" -ne "") {
            echo "tag=${{ github.event.inputs.tag_name }}" >> $env:GITHUB_OUTPUT
          } else {
            echo "tag=${env:GITHUB_REF_NAME}" >> $env:GITHUB_OUTPUT
          }
        shell: powershell

      - name: Extract Changelog from CHANGELOG.md
        run: python tool/extract_changelog.py "${{ steps.tag_info.outputs.tag }}" RELEASE_NOTES.md
        shell: bash

      - name: Create GitHub Release & Upload Windows Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: Release ${{ steps.tag_info.outputs.tag }}
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
          files: ClipFlow-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-ios:
    name: Build & Release iOS
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Determine Release Tag and Version
        id: tag_info
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag_name }}" ]; then
            tag="${{ github.event.inputs.tag_name }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          version="${tag#v}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build unsigned iOS Release App
        run: flutter build ios --release --no-codesign --build-name="${{ steps.tag_info.outputs.version }}" --build-number=${{ github.run_number }}

      - name: Package iOS payload as IPA
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -r ClipFlow-iOS.ipa Payload

      - name: Upload iOS workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipFlow-iOS
          path: build/ios/iphoneos/ClipFlow-iOS.ipa

      - name: Extract Changelog from CHANGELOG.md
        run: python3 tool/extract_changelog.py "${{ steps.tag_info.outputs.tag }}" RELEASE_NOTES.md

      - name: Upload iOS asset to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: Release ${{ steps.tag_info.outputs.tag }}
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
          files: build/ios/iphoneos/ClipFlow-iOS.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    name: Build & Release Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Determine Release Tag and Version
        id: tag_info
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag_name }}" ]; then
            tag="${{ github.event.inputs.tag_name }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          version="${tag#v}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build Android Release APK
        run: flutter build apk --release --build-name="${{ steps.tag_info.outputs.version }}" --build-number=${{ github.run_number }}

      - name: Rename Android APK
        run: cp build/app/outputs/flutter-apk/app-release.apk ClipFlow-Android.apk

      - name: Upload Android workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipFlow-Android
          path: ClipFlow-Android.apk

      - name: Extract Changelog from CHANGELOG.md
        run: python3 tool/extract_changelog.py "${{ steps.tag_info.outputs.tag }}" RELEASE_NOTES.md

      - name: Upload Android asset to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: Release ${{ steps.tag_info.outputs.tag }}
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
          files: ClipFlow-Android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
